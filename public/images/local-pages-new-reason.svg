    <circle cx="158" cy="1335" r="31" fill="url(#greenIcon)"/>
    <path d="M142 1348V1327M158 1348V1316M174 1348V1304M137 1348H180M140 1328L155 1318L168 1325L180 1306" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="224" y="1328" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="850">Believability over scale</text>
    <text x="224" y="1362" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500">Smaller, trustworthy, well-documented sites win over large, generic ones.</text>
