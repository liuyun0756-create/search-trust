    <path d="M182 1074H320" stroke="#E3E7EC" stroke-width="2"/>
    <text x="96" y="1125" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">Name, address, phone,</text>
    <text x="96" y="1160" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">categories, and details</text>
    <text x="96" y="1195" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">must be consistent</text>
    <text x="96" y="1230" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">across the web.</text>
  </g>

