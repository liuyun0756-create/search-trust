    <text x="590" y="602" text-anchor="middle" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="900">Local pages</text>
    <text x="590" y="660" text-anchor="middle" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="900">fail for a new</text>
    <text x="590" y="718" text-anchor="middle" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="900">reason</text>
    <text x="590" y="782" text-anchor="middle" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">It is not just the content -</text>
    <text x="590" y="817" text-anchor="middle" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">Google is stricter about</text>
    <text x="590" y="852" text-anchor="middle" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">trust, review, and ranking</text>
  </g>

