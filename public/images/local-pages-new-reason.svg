    <text x="868" y="651" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="850">are scrutinized</text>
    <path d="M868 682H1060" stroke="#E3E7EC" stroke-width="2"/>
    <text x="868" y="734" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">Doorway-like and</text>
    <text x="868" y="772" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">generic pages face</text>
    <text x="868" y="810" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">more risk.</text>
  </g>

  <g filter="url(#card)">
