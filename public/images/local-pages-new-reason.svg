    <path d="M548 1074H690" stroke="#E3E7EC" stroke-width="2"/>
    <text x="452" y="1125" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">Photos, local mentions,</text>
    <text x="452" y="1160" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">service areas, and real</text>
    <text x="452" y="1195" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">customer feedback</text>
    <text x="452" y="1230" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">build credibility.</text>
  </g>

  <g filter="url(#card)">
