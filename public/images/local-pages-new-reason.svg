    <circle cx="850" cy="1006" r="42" fill="#FFF3D7"/>
    <circle cx="840" cy="994" r="24" stroke="#F59E0B" stroke-width="7"/>
    <path d="M858 1012L884 1038" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    <text x="912" y="1008" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="850">Google is more</text>
    <text x="912" y="1045" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="850">cautious</text>
    <path d="M912 1074H1066" stroke="#E3E7EC" stroke-width="2"/>
    <text x="806" y="1125" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">More checks, better</text>
    <text x="806" y="1160" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">systems, and lower</text>
    <text x="806" y="1195" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">tolerance for low-value</text>
    <text x="806" y="1230" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">or manipulative pages.</text>
  </g>

  <g filter="url(#card)">
