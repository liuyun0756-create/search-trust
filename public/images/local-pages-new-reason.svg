    <text x="740" y="151" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">Content alone</text>
    <text x="740" y="193" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">is not enough</text>
    <text x="740" y="245" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Helpful content matters,</text>
    <text x="740" y="280" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">but it no longer guarantees</text>
    <text x="740" y="315" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">visibility.</text>
  </g>

  <g filter="url(#card)">
