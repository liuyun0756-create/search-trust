    <text x="220" y="151" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">AI era:</text>
    <text x="220" y="193" fill="#151C2C" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">stricter ranking review</text>
    <text x="220" y="245" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Higher bar for quality,</text>
    <text x="220" y="280" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">relevance, and local</text>
    <text x="220" y="315" fill="#536073" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">trustworthiness.</text>
  </g>

  <g filter="url(#card)">
