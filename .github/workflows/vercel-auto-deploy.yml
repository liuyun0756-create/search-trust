name: Frontend quality gate and Vercel deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type, contracts, tests, build and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contracts:check
      - run: npm run test:database
      - run: npm run build
      - run: npm run security:scan

  fixture-mirrors:
    name: Verify identity and candidate fixture mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the canonical fixture source
        uses: actions/checkout@v4
        with:
          repository: liuyun0756-create/SearchTrust-RD
          # Advance this pin when intentionally refreshing either fixture set.
          ref: 355928817c8ffe6f6a8a9d62f13c98fe4005cc98
          path: output/fixture-backend
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install fixture exporter dependencies
        working-directory: output/fixture-backend
        run: python -m pip install -r requirements-dev.txt
      - name: Check both frontend mirrors
        working-directory: output/fixture-backend
        run: |
          python scripts/export_v22_identity_fixtures.py --check --frontend-dir "$GITHUB_WORKSPACE"
          python scripts/export_v22_candidate_fixtures.py --check --frontend-dir "$GITHUB_WORKSPACE"

  browser:
    name: Local stubbed browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEARCHTRUST_TEST_BACKEND_ROOT: ${{ github.workspace }}/output/e2e-backend
    steps:
      - uses: actions/checkout@v4
      - name: Check out the matching backend test harness
        uses: actions/checkout@v4
        with:
          repository: liuyun0756-create/SearchTrust-RD
          ref: 0da935e7f368af5616e060d87d94447056a79724
          path: output/e2e-backend
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare backend integration dependencies
        run: |
          python -m venv "$SEARCHTRUST_TEST_BACKEND_ROOT/.venv"
          "$SEARCHTRUST_TEST_BACKEND_ROOT/.venv/bin/python" -m pip install -r "$SEARCHTRUST_TEST_BACKEND_ROOT/requirements-dev.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: browser_tests
        run: npm run test:e2e:ci
      - id: browser_scan
        if: always()
        run: npm run security:scan
      - id: prepare_artifacts
        if: always()
        run: npm run artifacts:prepare
      - name: Upload safe final-failure diagnostics
        if: ${{ always() && hashFiles('output/playwright/prepared/**') != '' && (steps.browser_tests.outcome == 'failure' || steps.browser_scan.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-final-failure-${{ github.run_id }}
          path: output/playwright/prepared
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Trigger Vercel production deployment
    needs: [quality, browser, fixture-mirrors]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the protected Vercel deployment hook
        env:
          VERCEL_HOOK_URL: ${{ secrets.VERCEL_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$VERCEL_HOOK_URL"
